name: Build DropZoneApp

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: dotnet --info
        run: dotnet --info

      - name: Publish win-x64 (self-contained, single file) -> artifacts
        shell: pwsh
        run: |
          $Out = "$env:GITHUB_WORKSPACE\artifacts\win-x64"
          New-Item -ItemType Directory -Force -Path $Out | Out-Null
          dotnet publish DropZoneApp\DropZoneApp.csproj `
            -c Release -r win-x64 `
            -p:PublishSingleFile=true --self-contained true `
            -o $Out
          if (!(Test-Path $Out)) { throw "Publish-Ausgabe nicht gefunden: $Out" }
          Get-ChildItem $Out

      - name: Upload artifact (EXE + Dateien)
        uses: actions/upload-artifact@v4
        with:
          name: DropZoneApp_win-x64_publish
          path: artifacts/win-x64
          if-no-files-found: error
          retention-days: 14
